# Drive → R2 → build → deploy na Cloudflare Workers. Preneseno iz capturedwella.
#
# Pokreće ga performanceconditioning-sync-trigger Worker kad vidi promjenu na
# Driveu, i jednom dnevno sam od sebe (to ujedno osvježi Google recenzije).
# Nikad na pull request: ovaj job drži R2 i Cloudflare ključeve, a repo je javan.
name: sync

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Build i deploy i kad se na Driveu ništa nije promijenilo
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"

# Jedan po jedan i nikad prekinut napola. Novi dispatch čeka svoj red.
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinano na commit, ne tag: tag se može pomaknuti na kod koji čita tajne ispod.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Drive → R2
        id: sync
        run: node scripts/sync-drive.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: pc-media

      # Deploy kad se manifest promijenio, svaki dan neovisno o tome (ako je
      # deploy ikad pao nakon uspjelog synca, samo ovo vraća stranicu u korak s
      # Driveom), i ručno s kvačicom `deploy` za promjenu koda.
      - name: Build
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'schedule' || inputs.deploy
        run: npm run build
        env:
          MEDIA_BASE: ${{ vars.MEDIA_BASE }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}

      - name: Deploy
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'schedule' || inputs.deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

      - name: Prijavi preskočene fotke
        if: steps.sync.outputs.skipped != '0'
        env:
          SKIPPED: ${{ steps.sync.outputs.skipped }}
        run: |
          echo "::error::$SKIPPED fotk(a/e) nije objavljeno — Drive id-evi su u koraku 'Drive → R2'. Najčešće HEIC ili RAW: izvesti u JPEG."
          exit 1
