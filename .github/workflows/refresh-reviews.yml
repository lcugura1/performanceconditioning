# Jednom dnevno pokreće novi build na Cloudflare Pagesu, da se povuku nove
# Google recenzije. Treba GitHub secret CF_DEPLOY_HOOK (URL deploy hooka).
name: Osvježi Google recenzije

on:
  schedule:
    - cron: "0 5 * * *" # svaki dan u 5:00 UTC
  workflow_dispatch: # ručno pokretanje iz kartice Actions

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Pokreni Cloudflare deploy hook
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CF_DEPLOY_HOOK nije postavljen, preskačem"
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
